name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Helix's default keymap for any Helix release newer than the ones already in
      # src/Keys/Defaults, embedded into Helide.exe by the build. Offline, the files
      # already there are what ships.
      - name: helix keymaps
        run: python tools/keymaps/helix_defaults.py src/Keys/Defaults

      - name: restore
        run: dotnet restore

      - name: build
        run: dotnet build -c Release --no-restore

      - name: publish app
        run: dotnet publish -c Release -r win-x64 --self-contained -p:DebugType=None -p:DebugSymbols=false -p:AllowedReferenceRelatedFileExtensions= -o publish

      # AutoUpdater is deprecated and no longer shipped: the app updates itself. Its
      # source stays under tools/AutoUpdater, and builds that already have it installed
      # keep working, because the archive still carries Helide.exe at its root.
      - name: package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/Helide.exe -DestinationPath helide-win-x64.zip
          # Published beside the archive so a download can be verified, by the app's own
          # updater and by a package manifest. sha256sum's layout: hash, two spaces, name.
          $hash = (Get-FileHash helide-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  helide-win-x64.zip" | Set-Content -Path SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: helide-win-x64
          path: |
            helide-win-x64.zip
            SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            helide-win-x64.zip
            SHA256SUMS.txt
          body_path: .github/release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Opens the winget-pkgs pull request for this release.
  winget:
    needs: build
    if: ${{ vars.WINGET_AUTOMATION == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: ujjwalvivek.Helide
          installers-regex: 'helide-win-x64\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
